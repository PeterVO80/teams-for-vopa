# ---------------------------------------------------------------------------
# VOPA Teams - complete stack (web application + PostgreSQL)
#
#   cp .env.example .env      # adjust passwords / secret key
#   docker compose up -d --build
#   open http://localhost:8000
# ---------------------------------------------------------------------------
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vopa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vopa}
      POSTGRES_DB: ${POSTGRES_DB:-vopa}
    volumes:
      # Named volume: the data survives `docker compose down` and upgrades.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vopa} -d ${POSTGRES_DB:-vopa}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vopa}:${POSTGRES_PASSWORD:-vopa}@db:5432/${POSTGRES_DB:-vopa}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the .env file}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      PROJECT_CODE_PREFIX: ${PROJECT_CODE_PREFIX:-PRJ}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-300}
      # Outlook / Microsoft 365 calendar link (optional, see README).
      MS365_TENANT_ID: ${MS365_TENANT_ID:-}
      MS365_CLIENT_ID: ${MS365_CLIENT_ID:-}
      MS365_CLIENT_SECRET: ${MS365_CLIENT_SECRET:-}
      MS365_TIMEZONE: ${MS365_TIMEZONE:-Romance Standard Time}
      MS365_CATEGORY_COLOR: ${MS365_CATEGORY_COLOR:-oranje}
      MICROSOFT_LOGIN: ${MICROSOFT_LOGIN:-off}
      APP_URL: ${APP_URL:-}
    ports:
      - "${WEB_PORT:-8000}:8000"

  outlook-sync:
    # Synchronises the team planning with the Outlook calendars every 5
    # minutes (services/outlook.py). Same image as "web"; it does nothing
    # but wait as long as the MS365_* variables are not set.
    build: .
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
    command: ["flask", "outlook-sync", "--loop", "300"]
    environment:
      RUN_MIGRATIONS: "0"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vopa}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vopa}
      SECRET_KEY: ${SECRET_KEY}
      WORKDAY_HOURS: ${WORKDAY_HOURS:-8}
      MS365_TENANT_ID: ${MS365_TENANT_ID:-}
      MS365_CLIENT_ID: ${MS365_CLIENT_ID:-}
      MS365_CLIENT_SECRET: ${MS365_CLIENT_SECRET:-}
      MS365_TIMEZONE: ${MS365_TIMEZONE:-Romance Standard Time}
      MS365_CATEGORY_COLOR: ${MS365_CATEGORY_COLOR:-oranje}
      MICROSOFT_LOGIN: ${MICROSOFT_LOGIN:-off}
      APP_URL: ${APP_URL:-}

volumes:
  pgdata:
