# ---------------------------------------------------------------------------
# VOPA Teams - Portainer stack (the same file for the test server on the
# local network and for the server on the internet, e.g. Hetzner)
#
#   caddy (ports 80/443)  ->  web (gunicorn)  ->  db (PostgreSQL)
#                             outlook-sync    ->  db
#                             backup (daily back-up of all data)
#
# Deploy in Portainer via:  Stacks > Add stack > "Repository"
#   Repository URL     : https://github.com/petervo80/teams-for-vopa
#   Repository ref     : refs/heads/main   (or the branch you want to run)
#   Compose path       : portainer-stack.yml
#   Authentication     : on, with a GitHub Personal Access Token (private repo)
#
# Then set the environment variables under "Environment variables" (list
# below). Portainer clones the repository and builds the images on the
# Docker host itself, so no image registry is needed.
#
# * On the internet: set DOMAIN (e.g. teams.vopa.be). Caddy gets a Let's
#   Encrypt certificate for it automatically (the DNS record must point to the
#   server, ports 80 and 443 must be open) and the app runs in HTTPS mode
#   (secure cookies, strict SECRET_KEY check, see app/security.py).
# * Test server on the local network: leave DOMAIN empty -> plain http on
#   WEB_PORT (e.g. 8080).
#
# Environment variables (set in Portainer):
#   SECRET_KEY         required - random string of at least 32 characters, e.g.
#                      python3 -c "import secrets; print(secrets.token_hex(32))"
#   POSTGRES_PASSWORD  required - database password
#   ADMIN_PASSWORD     required - password of the first admin account
#                      (at least 12 characters when DOMAIN is set)
#   DOMAIN             on the internet: domain name, e.g. teams.vopa.be
#   WEB_PORT           optional - http port on the host (default: 80; e.g. 8080 on
#                      a test server where 80 is taken). Keep 80 when DOMAIN is set.
#   HTTPS_PORT         optional - https port on the host (default: 443)
#   POSTGRES_USER      optional (default: vopa)
#   POSTGRES_DB        optional (default: vopa)
#   ADMIN_USERNAME     optional (default: admin)
#   ADMIN_EMAIL        optional
#   WORKDAY_HOURS      optional - hours in a working day for planning (default: 8)
#   PROJECT_CODE_PREFIX optional - prefix of automatic project codes
#                      (default: PRJ  ->  PRJ/2026/0001)
#   MAX_UPLOAD_MB      optional - max. upload size, e.g. supplier price lists (default: 300)
#   MS365_TENANT_ID, MS365_CLIENT_ID, MS365_CLIENT_SECRET
#                      optional - Outlook calendar link (see README "Outlook")
#   MS365_TIMEZONE     optional - Windows time zone (default: Romance Standard Time)
#   MS365_CATEGORY_COLOR optional - default colour of the "VOPA Teams" category (default: oranje)
#   MICROSOFT_LOGIN    optional - off / on / required: log in with Microsoft 365 (see README)
#   APP_URL            optional - address of the app (default: https://<DOMAIN>)
#   BACKUP_KEEP_DAYS   optional - days to keep the automatic daily back-ups (default: 14)
# ---------------------------------------------------------------------------

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vopa}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vopa}
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the stack environment variables}
  DOMAIN: ${DOMAIN:-}
  PROXY_COUNT: "1"          # Caddy in front of the app
  WORKDAY_HOURS: ${WORKDAY_HOURS:-8}
  PROJECT_CODE_PREFIX: ${PROJECT_CODE_PREFIX:-PRJ}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-300}
  MS365_TENANT_ID: ${MS365_TENANT_ID:-}
  MS365_CLIENT_ID: ${MS365_CLIENT_ID:-}
  MS365_CLIENT_SECRET: ${MS365_CLIENT_SECRET:-}
  MS365_TIMEZONE: ${MS365_TIMEZONE:-Romance Standard Time}
  MS365_CATEGORY_COLOR: ${MS365_CATEGORY_COLOR:-oranje}
  MICROSOFT_LOGIN: ${MICROSOFT_LOGIN:-off}
  APP_URL: ${APP_URL:-}
  BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}

services:
  caddy:
    # Reverse proxy: HTTPS with automatic certificates when DOMAIN is set,
    # plain http otherwise (docker/caddy/Caddyfile).
    build: ./docker/caddy
    pull_policy: build
    restart: unless-stopped
    depends_on:
      - web
    environment:
      SITE_ADDRESS: ${DOMAIN:-:80}
    ports:
      - "${WEB_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"   # HTTP/3
    volumes:
      - caddy_data:/data      # certificates - keep this volume
      - caddy_config:/config
    networks:
      - frontend

  web:
    # Built from the Dockerfile in the repository on the Docker host itself.
    # There is deliberately no "image:" line: this image does not exist in
    # any registry, so Portainer must never try to pull it.
    # "pull_policy: build" makes "docker compose pull" (Portainer's "Re-pull
    # image") skip this service, and rebuilds it from the latest code on
    # every (re)deploy.
    build: .
    pull_policy: build
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-env
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in the stack environment variables}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    volumes:
      - vopa_app_backups:/app/backups   # Back-ups page in the app
    # No "ports:": only reachable through Caddy.
    healthcheck:
      # Shows the container as "healthy" in Portainer once the app answers.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/auth/login', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - frontend
      - backend

  outlook-sync:
    # Synchronises the team planning with the Outlook calendars every 5
    # minutes (services/outlook.py). Same image as "web"; it does nothing
    # but wait as long as the MS365_* variables are not set.
    build: .
    pull_policy: build
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
    command: ["flask", "outlook-sync", "--loop", "300"]
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "0"
    networks:
      - frontend   # needs the internet (Microsoft Graph)
      - backend

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vopa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the stack environment variables}
      POSTGRES_DB: ${POSTGRES_DB:-vopa}
    volumes:
      # Database files. Survives stack updates and re-deploys.
      - vopa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vopa} -d ${POSTGRES_DB:-vopa}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend
    # No "ports:": the database is never reachable from outside.

  backup:
    # Daily back-up of all data (the same ZIP files as the Back-ups page in
    # the app, where they can be downloaded and restored). Back-ups older than
    # BACKUP_KEEP_DAYS are deleted. Also copy them off the server regularly:
    # a back-up on the same server doesn't survive losing it.
    build: .
    pull_policy: build
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
    command: ["flask", "backup-create", "--loop", "86400"]
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "0"
    volumes:
      - vopa_app_backups:/app/backups
    networks:
      - backend

volumes:
  vopa_pgdata:
  vopa_app_backups:
  caddy_data:
  caddy_config:

networks:
  frontend:
  backend:
    internal: true   # the database network has no route to the internet
