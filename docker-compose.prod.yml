# ---------------------------------------------------------------------------
# VOPA Teams - production on the internet (e.g. a Hetzner Cloud server)
#
#   Caddy (HTTPS, ports 80/443)  ->  web (gunicorn)  ->  db (PostgreSQL)
#                                    outlook-sync    ->  db
#                                    backup (daily pg_dump)
#
# Only Caddy is reachable from outside. It gets a Let's Encrypt certificate
# for DOMAIN automatically (the DNS record must point to this server and
# ports 80 and 443 must be open).
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# or in Portainer: Stacks > Add stack > Repository, compose path
# "docker-compose.prod.yml". See README "Running on the internet".
#
# Environment variables (in .env next to this file, or in Portainer):
#   DOMAIN             required - e.g. teams.vopa.be
#   ACME_EMAIL         required - e-mail for Let's Encrypt (certificate notices)
#   SECRET_KEY         required - at least 32 random characters:
#                      python3 -c "import secrets; print(secrets.token_hex(32))"
#   POSTGRES_PASSWORD  required - long random password
#   ADMIN_PASSWORD     required - first admin account (change it after logging in)
#   POSTGRES_USER / POSTGRES_DB / ADMIN_USERNAME / ADMIN_EMAIL / WORKDAY_HOURS /
#   PROJECT_CODE_PREFIX / MAX_UPLOAD_MB / MS365_* : as in portainer-stack.yml
#   BACKUP_KEEP_DAYS   optional - days of daily database backups to keep (default 14)
# ---------------------------------------------------------------------------

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vopa}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vopa}
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY (at least 32 random characters)}
  HTTPS: "1"
  WORKDAY_HOURS: ${WORKDAY_HOURS:-8}
  PROJECT_CODE_PREFIX: ${PROJECT_CODE_PREFIX:-PRJ}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-300}
  MS365_TENANT_ID: ${MS365_TENANT_ID:-}
  MS365_CLIENT_ID: ${MS365_CLIENT_ID:-}
  MS365_CLIENT_SECRET: ${MS365_CLIENT_SECRET:-}
  MS365_TIMEZONE: ${MS365_TIMEZONE:-Romance Standard Time}
  MS365_CATEGORY_COLOR: ${MS365_CATEGORY_COLOR:-oranje}
  APP_URL: https://${DOMAIN}

services:
  caddy:
    build: ./docker/caddy
    pull_policy: build
    restart: unless-stopped
    depends_on:
      - web
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN, e.g. teams.vopa.be}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL for Let's Encrypt}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - caddy_data:/data      # certificates - keep this volume
      - caddy_config:/config
    networks:
      - frontend

  web:
    build: .
    pull_policy: build
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-env
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    # No "ports:": only reachable through Caddy.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/auth/login', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - frontend
      - backend

  outlook-sync:
    build: .
    pull_policy: build
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
    command: ["flask", "outlook-sync", "--loop", "300"]
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "0"
    networks:
      - frontend   # needs the internet (Microsoft Graph)
      - backend

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vopa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vopa}
    volumes:
      - vopa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vopa} -d ${POSTGRES_DB:-vopa}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend
    # No "ports:": the database is never reachable from outside.

  backup:
    # Daily compressed database dump into the "vopa_backups" volume; dumps
    # older than BACKUP_KEEP_DAYS are deleted. Also copy them off the server
    # (see README): a backup on the same server doesn't survive losing it.
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-vopa}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-vopa}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          name=vopa-$$(date +%Y-%m-%d_%H%M).sql.gz
          if pg_dump --no-owner | gzip > /backups/partial.tmp; then
            mv /backups/partial.tmp "/backups/$$name" && echo "backup: $$name"
          else
            echo "backup: FAILED"
          fi
          find /backups -name 'vopa-*.sql.gz' -mtime +$$KEEP_DAYS -delete
          sleep 86400
        done
    volumes:
      - vopa_backups:/backups
    networks:
      - backend

volumes:
  vopa_pgdata:
  vopa_backups:
  caddy_data:
  caddy_config:

networks:
  frontend:
  backend:
    internal: true   # the database network has no route to the internet
