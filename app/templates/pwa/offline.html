<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="{{ theme_color }}">
  <title>Geen verbinding · VOPA Teams</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap-icons/bootstrap-icons.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="bg-body-tertiary">
  <nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand d-flex align-items-center gap-2">
      <img src="{{ url_for('static', filename='img/vopa-logo.svg') }}" alt="VOPA" class="brand-logo"> Teams
    </span>
  </nav>
  <main class="container py-5" style="max-width: 520px">
    <div class="card shadow-sm"><div class="card-body p-4 text-center">
      <i class="bi bi-wifi-off display-4 text-body-secondary"></i>
      <h1 class="h4 mt-3">Geen verbinding</h1>
      <p class="text-body-secondary">VOPA Teams kan de server niet bereiken. Controleer de internetverbinding
        (wifi of mobiele data) en probeer opnieuw.</p>
      <p class="small text-body-secondary">Gegevens worden niet op dit toestel bewaard: de app werkt alleen met verbinding.</p>
      <a class="btn btn-primary" href="/"><i class="bi bi-arrow-clockwise"></i> Opnieuw proberen</a>
    </div></div>
  </main>
</body>
</html>
